name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint release
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Check release signing configuration
        id: release-check
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f release.keystore.enc ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release keystore
        if: ${{ steps.release-check.outputs.ready == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in release.keystore.enc \
            -out release.keystore \
            -k "$ANDROID_KEYSTORE_PASSWORD"
          test -s release.keystore

      - name: Build release APK
        if: ${{ steps.release-check.outputs.ready == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish release
        if: ${{ steps.release-check.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: APKUpdater
        run: |
          cp app/build/outputs/apk/release/app-release.apk APKUpdater.apk
          NOTES="Built from ${GITHUB_SHA:0:7} on $(date -u '+%d %B %Y, %H:%M UTC')."
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" APKUpdater.apk --repo "$REPO" --clobber
            gh release edit "$TAG_NAME" --repo "$REPO" --notes "$NOTES" >/dev/null
            gh api --method PATCH "repos/$REPO/git/refs/tags/$TAG_NAME" \
              -f sha="$GITHUB_SHA" -F force=true --silent \
              || echo "::warning::The tag still points at an older commit."
          else
            gh release create "$TAG_NAME" APKUpdater.apk \
              --repo "$REPO" \
              --title "APKUpdater" \
              --notes "$NOTES"
          fi
