name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decrypt Keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f release.keystore.enc ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in release.keystore.enc -out release.keystore -k "$ANDROID_KEYSTORE_PASSWORD"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v1.0.0
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          TARGET_APK="APKUpdater-1.0.0.apk"
          cp "$APK_FILE" "$TARGET_APK"

          # Replace existing release and tag if already present
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true

          # Release notes stay empty: single space body so GitHub does not autofill commits
          gh release create "$TAG_NAME" "$TARGET_APK" --title "$TARGET_APK" --notes " "

