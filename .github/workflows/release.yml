name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/APKUpdater-1.0.0.apk
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: APKUpdater v1.0.0
          body: |
            ## APKUpdater v1.0.0 (Stable)

            ### Highlights
            - Direct APKMirror API integration for update scanning.
            - Strict Stable-only filter (Alpha, Beta, Pre-release excluded).
            - Filter by Updates, User Apps, System Apps, or All Installed Apps.
            - Deep linking to APKMirror for instant updates.
            - Material 3 dynamic theme with edge-to-edge layout.

            ### Assets
            - **APKUpdater-1.0.0.apk**: Ready-to-install Android package.
          draft: false
          prerelease: false
          files: release-artifacts/APKUpdater-1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
