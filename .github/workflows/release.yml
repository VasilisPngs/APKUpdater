name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f release.keystore.enc ]; then
            echo "release.keystore.enc is missing"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in release.keystore.enc \
            -out release.keystore \
            -k "$ANDROID_KEYSTORE_PASSWORD"
          test -s release.keystore

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v1.0.0
        run: |
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_FILE"
          cp "$APK_FILE" "APKUpdater-1.0.0.apk"
          gh release delete "$TAG_NAME" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG_NAME" "APKUpdater-1.0.0.apk" \
            --repo "${{ github.repository }}" \
            --title "APKUpdater-1.0.0" \
            --notes " "
